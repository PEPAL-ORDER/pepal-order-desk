<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PEPAL Order Desk</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{
  --bg:#f4f5f7;--surface:#ffffff;--surface2:#f0f2f5;--border:#e1e4e9;--border2:#cfd4db;
  --text:#1a1d22;--muted:#5f6874;--faint:#8a929c;
  --accent:#0f766e;--accent-ink:#ffffff;--accent-weak:#e3f3f1;
  --ok:#15803d;--warn:#b45309;--bad:#c2261d;--info:#1d4ed8;--neutral:#5f6874;--violet:#6d28d9;
  --shadow:0 1px 2px rgba(16,24,40,.06),0 1px 3px rgba(16,24,40,.08);
  --shadow-lg:0 12px 32px rgba(16,24,40,.18);
  --radius:10px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0e1115;--surface:#161a20;--surface2:#1d222a;--border:#2a3039;--border2:#38404b;
    --text:#e7eaee;--muted:#9aa3ae;--faint:#6f7883;
    --accent:#2dd4bf;--accent-ink:#06201d;--accent-weak:#123430;
    --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#7aa7ff;--neutral:#9aa3ae;--violet:#b197fc;
    --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.55);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1115;--surface:#161a20;--surface2:#1d222a;--border:#2a3039;--border2:#38404b;
  --text:#e7eaee;--muted:#9aa3ae;--faint:#6f7883;
  --accent:#2dd4bf;--accent-ink:#06201d;--accent-weak:#123430;
  --ok:#4ade80;--warn:#fbbf24;--bad:#f87171;--info:#7aa7ff;--neutral:#9aa3ae;--violet:#b197fc;
  --shadow:0 1px 2px rgba(0,0,0,.4);--shadow-lg:0 12px 32px rgba(0,0,0,.55);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.45 "Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--accent)}
.num{font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.muted{color:var(--muted)}.faint{color:var(--faint)}.small{font-size:12px}
.hidden{display:none!important}

/* header */
header{position:sticky;top:0;z-index:20;background:var(--surface);border-bottom:1px solid var(--border)}
.hbar{max-width:1320px;margin:0 auto;display:flex;align-items:center;gap:12px;padding:10px 16px}
.brand{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:.2px;white-space:nowrap}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:800;font-size:15px}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:11px;letter-spacing:0}
.search{flex:1;max-width:380px;margin-left:auto;position:relative}
.search input{width:100%;padding:8px 12px 8px 32px;border:1px solid var(--border);border-radius:8px;background:var(--surface2)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
nav.tabs{max-width:1320px;margin:0 auto;display:flex;gap:2px;padding:0 12px;overflow-x:auto;scrollbar-width:none}
nav.tabs button{background:none;border:0;padding:10px 12px;border-bottom:2px solid transparent;color:var(--muted);cursor:pointer;white-space:nowrap;font-weight:600}
nav.tabs button.on{color:var(--text);border-bottom-color:var(--accent)}
nav.tabs .count{display:inline-block;min-width:18px;padding:0 6px;margin-left:6px;border-radius:9px;background:var(--accent-weak);color:var(--accent);font-size:11px;line-height:18px;text-align:center}

/* buttons */
.btn{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;border:1px solid var(--border2);background:var(--surface);cursor:pointer;font-weight:600;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.07)}
.btn.danger{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,var(--border))}
.btn.sm{padding:4px 9px;font-size:12px;border-radius:7px}
.btn.ghost{border-color:transparent;background:transparent}
.btn.ghost:hover{background:var(--surface2)}
.iconbtn{width:34px;height:34px;display:grid;place-items:center;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer}
.iconbtn:hover{background:var(--surface2)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface2);cursor:pointer;font-size:12px;font-weight:600;white-space:nowrap}
.pill .dot{width:8px;height:8px;border-radius:50%;background:var(--ok)}
.pill.warn .dot{background:var(--warn)}.pill.bad .dot{background:var(--bad)}

main{max-width:1320px;margin:0 auto;padding:18px 16px 60px}
h2{font-size:18px;margin:0 0 4px}
h3{font-size:14px;margin:0;font-weight:700}
.pagehead{display:flex;align-items:flex-end;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pagehead .grow{flex:1}

/* cards */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:var(--shadow)}
.card>.ch{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--border)}
.card>.ch .grow{flex:1}
.card>.cb{padding:12px 14px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr))}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:14px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px;box-shadow:var(--shadow);text-align:left;cursor:pointer;transition:border-color .12s,transform .12s}
.kpi:hover{border-color:var(--accent);transform:translateY(-1px)}
.kpi .l{font-size:12px;color:var(--muted);font-weight:600}
.kpi .v{font-size:22px;font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:11px;color:var(--faint);margin-top:2px}
.kpi.static{cursor:default}.kpi.static:hover{border-color:var(--border);transform:none}
.kpi.accent .v{color:var(--accent)}.kpi.bad .v{color:var(--bad)}

/* tables */
.tw{overflow-x:auto}
table{width:100%;border-collapse:collapse}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:middle}
th{font-size:11px;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);font-weight:700;background:var(--surface2);white-space:nowrap}
tbody tr:last-child td{border-bottom:0}
tr.click{cursor:pointer}
tr.click:hover td{background:color-mix(in srgb,var(--accent) 7%,transparent)}
td.link,span.link{color:var(--accent);cursor:pointer;font-weight:600}
td.link:hover,span.link:hover{text-decoration:underline}
tfoot td{font-weight:700;background:var(--surface2);border-top:1px solid var(--border2)}
th.sort{cursor:pointer}th.sort:hover{color:var(--text)}
.zero{color:var(--faint)}

/* badges */
.b{display:inline-block;padding:2px 8px;border-radius:999px;font-size:11.5px;font-weight:700;white-space:nowrap;--c:var(--neutral);color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid color-mix(in srgb,var(--c) 26%,transparent)}
.b.ok{--c:var(--ok)}.b.warn{--c:var(--warn)}.b.bad{--c:var(--bad)}.b.info{--c:var(--info)}.b.violet{--c:var(--violet)}.b.accent{--c:var(--accent)}

/* bars */
.bar{position:relative;height:10px;border-radius:5px;background:var(--surface2);min-width:80px;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:color-mix(in srgb,var(--accent) 35%,transparent)}
.bar b{position:absolute;left:0;top:0;bottom:0;border-radius:5px;background:var(--accent)}

/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-bottom:12px}
.filters select,.filters input[type=text],.filters input[type=search]{padding:7px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px}
.chip{padding:6px 11px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:600;font-size:12.5px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .n{opacity:.75;margin-left:4px}
.notice{display:flex;gap:8px;align-items:center;padding:8px 12px;border-radius:8px;background:var(--accent-weak);color:var(--text);margin-bottom:12px;font-size:13px}

/* to do cards */
.todo{display:grid;gap:10px}
.tcard{background:var(--surface);border:1px solid var(--border);border-left:4px solid var(--border2);border-radius:var(--radius);padding:12px 14px;display:grid;grid-template-columns:1fr auto;gap:8px 16px;box-shadow:var(--shadow)}
.tcard.late{border-left-color:var(--bad)}.tcard.mid{border-left-color:var(--warn)}.tcard.fresh{border-left-color:var(--ok)}
.tcard .top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.tcard .who{font-weight:700;cursor:pointer}.tcard .who:hover{color:var(--accent)}
.tcard .meta{color:var(--muted);font-size:12.5px;margin-top:3px}
.tcard .acts{display:flex;gap:6px;flex-wrap:wrap;grid-column:1/-1}
.tcard .amt{text-align:right}
.tcard .amt .due{font-weight:700;font-size:16px;color:var(--bad)}

/* drawer */
.scrim{position:fixed;inset:0;background:rgba(10,14,20,.45);z-index:40;opacity:0;pointer-events:none;transition:opacity .15s}
.scrim.on{opacity:1;pointer-events:auto}
#drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100vw);background:var(--bg);z-index:41;box-shadow:var(--shadow-lg);transform:translateX(105%);transition:transform .18s ease;display:flex;flex-direction:column}
#drawer.on{transform:none}
#drawer .dh{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--surface);border-bottom:1px solid var(--border)}
#drawer .dh h3{flex:1;font-size:15px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#drawer .db{flex:1;overflow:auto;padding:14px}
.sect{margin-bottom:14px}
.kv{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kv>div{background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px}
.kv .k{font-size:11px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.3px}
.kv .v{font-weight:700;margin-top:2px;font-variant-numeric:tabular-nums}
.orow{display:grid;grid-template-columns:auto 1fr auto;gap:4px 12px;padding:10px 12px;background:var(--surface);border:1px solid var(--border);border-radius:8px;margin-bottom:8px;cursor:pointer}
.orow:hover{border-color:var(--accent)}
.orow .no{font-weight:800;color:var(--accent);min-width:34px}
.orow .r{text-align:right}
.orow .badges{grid-column:2/-1;display:flex;gap:6px;flex-wrap:wrap}
.notebox{padding:10px 12px;border-radius:8px;border:1px solid var(--border);background:var(--surface);white-space:pre-wrap}
.notebox.check{border-color:color-mix(in srgb,var(--warn) 50%,var(--border));background:color-mix(in srgb,var(--warn) 9%,var(--surface))}
.actions{display:flex;gap:6px;flex-wrap:wrap}
.log{font-size:12px;color:var(--muted)}
.log div{padding:3px 0;border-bottom:1px dashed var(--border)}

/* modal */
#modal{position:fixed;inset:0;z-index:60;display:none;align-items:flex-start;justify-content:center;padding:4vh 12px;background:rgba(10,14,20,.5);overflow:auto}
#modal.on{display:flex}
.mbox{background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:var(--shadow-lg);width:min(820px,100%);}
.mbox.narrow{width:min(480px,100%)}
.mh{display:flex;align-items:center;gap:8px;padding:14px 16px;border-bottom:1px solid var(--border)}
.mh h3{flex:1;font-size:16px}
.mb{padding:14px 16px}
.mf{display:flex;justify-content:flex-end;gap:8px;padding:12px 16px;border-top:1px solid var(--border);background:var(--surface2);border-radius:0 0 12px 12px;flex-wrap:wrap}
.form{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,180px),1fr));gap:10px 12px}
.field{display:flex;flex-direction:column;gap:4px}
.field.wide{grid-column:1/-1}
.field label{font-size:12px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea,td input,td select{padding:7px 9px;border:1px solid var(--border2);border-radius:7px;background:var(--surface);width:100%;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus,td input:focus,td select:focus,.search input:focus,.filters input:focus,.filters select:focus{outline:2px solid color-mix(in srgb,var(--accent) 55%,transparent);outline-offset:0;border-color:var(--accent)}
.hint{font-size:12px;color:var(--warn);min-height:0}
.fsec{margin:16px 0 8px;font-size:12px;font-weight:800;text-transform:uppercase;letter-spacing:.5px;color:var(--muted)}
.totals{display:flex;gap:18px;flex-wrap:wrap;justify-content:flex-end;padding:10px 12px;background:var(--surface2);border-radius:8px;margin-top:10px}
.totals div{text-align:right}.totals .k{font-size:11px;color:var(--muted)}.totals .v{font-weight:800;font-variant-numeric:tabular-nums}
.itbl td{padding:5px 6px}.itbl input{text-align:right}
.dlvcol{display:none}.showdlv .dlvcol{display:table-cell}
.radio{display:flex;flex-direction:column;gap:8px}
.radio label{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1px solid var(--border);border-radius:8px;cursor:pointer}
.radio label:has(input:checked){border-color:var(--accent);background:var(--accent-weak)}
.xsec{border:1px solid var(--border);border-radius:9px;margin-top:10px;background:var(--surface2)}
.xsec>summary{list-style:none;cursor:pointer;padding:10px 12px;display:flex;gap:10px;align-items:center;font-weight:700;user-select:none}
.xsec>summary::-webkit-details-marker{display:none}
.xsec>summary::before{content:'▸';color:var(--muted);transition:transform .12s;display:inline-block}
.xsec[open]>summary::before{transform:rotate(90deg)}
.xsec>summary .xs{margin-left:auto;font-weight:500;font-size:12.5px;color:var(--muted);text-align:right}
.xsec>summary:hover{color:var(--accent)}
.xsec .xb{padding:0 12px 12px}
.pill.ok .dot{background:var(--ok)}.pill.warn .dot{background:var(--warn)}.pill.bad .dot{background:var(--bad)}.pill.off .dot{background:var(--faint)}
.pill.bad{border-color:color-mix(in srgb,var(--bad) 50%,var(--border));color:var(--bad)}
.userchip{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-weight:700;font-size:12.5px;white-space:nowrap}
.userchip:hover{border-color:var(--accent)}
body.locked .search,body.locked #syncPill,body.locked #userChip,body.locked .hbar [data-act=new-order],body.locked #tabs{display:none!important}
body:not(.admin) .adminonly{display:none!important}
.seg{display:inline-flex;border:1px solid var(--border2);border-radius:8px;overflow:hidden;width:100%}
.seg button{flex:1;padding:7px 8px;border:0;background:var(--surface);cursor:pointer;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--border2)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
.dgrp{display:flex;gap:4px}.dgrp input{min-width:0;flex:1}.dgrp select{width:72px;flex:none;padding:7px 4px}
.cmp td.diff{color:var(--warn);font-weight:700}

/* empty */
.empty{max-width:720px;margin:40px auto;text-align:center}
.empty .card{padding:28px}
.empty .opts{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px;margin-top:20px;text-align:left}
.empty .opt{border:1px solid var(--border);border-radius:10px;padding:14px;cursor:pointer;background:var(--surface)}
.empty .opt:hover{border-color:var(--accent)}
.empty .opt b{display:block;margin-bottom:4px}
.nodata{padding:18px;text-align:center;color:var(--muted)}

#toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%) translateY(20px);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:8px;font-weight:600;opacity:0;transition:.2s;z-index:80;pointer-events:none;max-width:90vw}
#toast.on{opacity:1;transform:translateX(-50%)}
.listrow{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tag{display:inline-flex;align-items:center;gap:4px;padding:4px 6px 4px 10px;border-radius:999px;background:var(--surface2);border:1px solid var(--border);font-size:12.5px}
.tag button{border:0;background:none;cursor:pointer;color:var(--faint);font-size:14px;line-height:1;padding:0 4px}
.tag button:hover{color:var(--bad)}
kbd{font-size:11px;padding:1px 5px;border:1px solid var(--border2);border-radius:4px;background:var(--surface2)}
@media (max-width:720px){
  .hbar{flex-wrap:wrap}.search{order:5;max-width:none;flex-basis:100%;margin:0}
  .brand small{display:none}
  .kpi .v{font-size:18px}
  .tcard{grid-template-columns:1fr}.tcard .amt{text-align:left}
}
@media print{header,.filters,.chips,.acts,#drawer,.scrim,.btn{display:none!important}body{background:#fff}.card,.tcard{box-shadow:none}}
</style>
</head>
<body>
<header>
  <div class="hbar">
    <div class="brand"><div class="logo">P</div><div>PEPAL Order Desk<small>Orders · Delivery · Payments</small></div></div>
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="gsearch" type="search" placeholder="Search order no, customer, phone…  ( / )" autocomplete="off">
    </div>
    <button class="pill" id="syncPill" data-act="sync-pill"><span class="dot"></span><span id="syncTxt">…</span></button>
    <button class="userchip" id="userChip" data-act="account">👤 <span id="userTxt"></span></button>
    <button class="btn primary" data-act="new-order">+ New order</button>
    <button class="iconbtn" data-act="theme" id="themeBtn" title="Switch light / dark"></button>
  </div>
  <nav class="tabs" id="tabs">
    <button data-act="tab" data-tab="dash">Dashboard</button>
    <button data-act="tab" data-tab="todo">To Do <span class="count" id="todoCount">0</span></button>
    <button data-act="tab" data-tab="orders">Orders</button>
    <button data-act="tab" data-tab="customers">Customers</button>
    <button data-act="tab" data-tab="log" class="adminonly">Activity log</button>
    <button data-act="tab" data-tab="settings">Settings &amp; Data</button>
  </nav>
</header>
<main id="main"></main>

<div class="scrim" id="scrim" data-act="drawer-close"></div>
<aside id="drawer" aria-hidden="true">
  <div class="dh">
    <button class="iconbtn" data-act="drawer-back" id="drawerBack" title="Back">←</button>
    <h3 id="drawerTitle"></h3>
    <button class="iconbtn" data-act="drawer-close" title="Close (Esc)">✕</button>
  </div>
  <div class="db" id="drawerBody"></div>
</aside>
<div id="modal"></div>
<div id="toast"></div>
<input type="file" id="fileXlsx" accept=".xlsx,.xlsm,.xls" class="hidden">
<input type="file" id="fileJson" accept=".json,application/json" class="hidden">

<script>
"use strict";
/* ============ cloud settings ============ */
// ↓↓↓ Paste your Apps Script Web app URL (ends with /exec) between the quotes before publishing.
//     If left empty, the sign-in screen asks for it once on each device.
const DEFAULT_API_URL = 'https://script.google.com/macros/s/AKfycbwoD-IbsIS3Q15w9hmN4LPX8Tca-7ygwQnlJg1qFP7DrYbQG9EOMeoEac3dqjs13lfC/exec';

const THEMEKEY='pepal_order_desk_theme', OLDKEY='pepal_order_desk_v1';
const CFGKEY='pepal_cloud_cfg', CACHEKEY='pepal_cloud_cache', QKEY='pepal_cloud_queue', ISSKEY='pepal_cloud_issues';
const LS={
  get(k){try{return localStorage.getItem(k)}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,v);return true}catch(e){return false}},
  del(k){try{localStorage.removeItem(k)}catch(e){}}
};
const jget=(k,d)=>{try{const v=LS.get(k);return v?JSON.parse(v):d}catch(e){return d}};
const clone=o=>JSON.parse(JSON.stringify(o));
const DELIVERY=['Yet to Deliver','Dispatched','Part Delivered','Delivered','Cancelled'];
const PAYSTAT=['Paid','Part paid','Unpaid','Amount TBC','n/a'];
const ORDER_FIELDS=['id','no','date','channel','customer','phone','items','disc','flat','offer','override','payments','status','deliveryDate','notes','payMode'];

function nowISO(){return new Date().toISOString()}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function uid(p){return (p||'x')+Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function blankDB(){return{products:[],lists:{payModes:['UPI','Cash','Cheque','Bank Transfer/NEFT/RTGS','Card'],offers:[{name:'Standard',kind:'',val:null}]},customers:[],orders:[],meta:{}}}
function normalizeDB(d){
  const b=blankDB();d=d||b;d.meta=d.meta||{};d.lists=Object.assign(b.lists,d.lists||{});
  d.products=d.products||[];d.customers=d.customers||[];d.lists.offers=(d.lists.offers||[]).map(normOffer);
  d.orders=(d.orders||[]).map(o=>Object.assign({items:[],payments:[],log:[],status:'',notes:''},o));return d}
function normOffer(x){if(x.kind!==undefined)return x;const v=x.pct!=null&&x.pct!==''?+x.pct:(x.flat!=null&&x.flat!==''?+x.flat:null);return{name:x.name,kind:x.pct!=null&&x.pct!==''?'pct':(x.flat!=null&&x.flat!==''?'flat':''),val:v}}
const CHANNELS=['Online','Offline'];
function parseOfferName(n){let m=n.match(/^(\d+(?:\.\d+)?)\s*%/);if(m)return{name:n,kind:'pct',val:+m[1]};
  m=n.match(/([\d,]+(?:\.\d+)?)/);if(m&&/flat|total|bill/i.test(n))return{name:n,kind:'flat',val:+m[1].replace(/,/g,'')};
  if(m&&/off|less/i.test(n))return{name:n,kind:'unit',val:+m[1].replace(/,/g,'')};
  m=n.match(/^(?:₹|rs\.?)?\s*([\d,]+(?:\.\d+)?)\s*(?:\/-)?\s*(?:off|flat|rs|₹)/i)||n.match(/^(?:₹|rs\.?)\s*([\d,]+(?:\.\d+)?)/i);if(m)return{name:n,kind:'flat',val:+m[1].replace(/,/g,'')};return{name:n,kind:'',val:null}}
const defaultOffer=()=>((DB.lists.offers.find(x=>/^standard$/i.test(x.name))||DB.lists.offers[0]||{}).name||'');

function pendingIds(){const s=new Set();QUEUE.forEach(op=>{const id=op.orderId||(op.order&&op.order.id);if(id)s.add(id)});return s}

function buildView(){
  DB=normalizeDB(clone(CACHE&&CACHE.data||blankDB()));
  QUEUE.forEach(op=>{try{applyLocal(DB,op)}catch(e){console.warn('local apply',e)}});
}
// Shows a change immediately on this device; the cloud applies the same change for real.
function applyLocal(d,op){
  const f=id=>d.orders.find(o=>o.id===id);const bump=o=>{o.v=(+o.v||0)+1};
  const lg=(o,msg)=>{(o.log=o.log||[]).push({at:op.at,user:CFG.user,msg:msg+' (waiting to sync)'})};
  switch(op.type){
    case'order.upsert':{const o=clone(op.order);const ex=f(o.id);
      if(ex){Object.assign(ex,o);bump(ex);lg(ex,'Edited')}
      else{const n=Object.assign({v:1,createdBy:CFG.user,createdAt:op.at,log:[]},o);lg(n,'Order created');d.orders.push(n)}break}
    case'order.delete':d.orders=d.orders.filter(o=>o.id!==op.orderId);break;
    case'order.status':{const o=f(op.orderId);if(!o)break;const prev=o.status||'not set';o.status=op.status;if(op.status==='Delivered'){o.items.forEach(i=>i.dlv=i.qty);if(!o.deliveryDate)o.deliveryDate=op.date}bump(o);lg(o,'Status '+prev+' → '+op.status);break}
    case'order.patch':{const o=f(op.orderId);if(!o)break;Object.assign(o,clone(op.fields));bump(o);lg(o,op.why||'Updated');break}
    case'payment.add':{const o=f(op.orderId);if(!o)break;o.payments=o.payments||[];if(!o.payments.some(p=>p.id===op.payment.id)){o.payments.push(Object.assign({by:CFG.user},op.payment));if(!o.payMode)o.payMode=op.payment.mode}bump(o);lg(o,'Payment '+money(op.payment.amount));break}
    case'payment.del':{const o=f(op.orderId);if(!o)break;o.payments=(o.payments||[]).filter(p=>p.id!==op.paymentId);bump(o);break}
    case'customer.add':if(!d.customers.some(c=>c.id===op.customer.id))d.customers.push(Object.assign({createdBy:CFG.user,createdAt:op.at},op.customer));break;
    case'customer.update':{const c=d.customers.find(c=>c.id===op.customer.id);if(c)Object.assign(c,op.customer);break}
    case'customer.delete':d.customers=d.customers.filter(c=>c.id!==op.customerId);break;
    case'master.set':d.products=clone(op.products);d.lists=clone(op.lists);break;
  }
}
function queueOp(op,msg){
  op.id=uid('op');op.at=nowISO();op.by=CFG.user;
  if(op.type==='master.set')QUEUE=QUEUE.filter(q=>q.type!=='master.set');   // newest masters win
  QUEUE.push(op);persist();buildView();refresh();if(msg)toast(msg);
  clearTimeout(SYNC.timer);SYNC.timer=setTimeout(sync,400);
}
function orderFields(o){const r={};ORDER_FIELDS.forEach(k=>{if(k in o)r[k]=clone(o[k])});return r}

/* ============ talking to the Apps Script ============ */
async function api(action,payload){
  const url=apiUrl();if(!url)throw new Error('No cloud link set');
  let r;
  try{r=await fetch(url,{method:'POST',headers:{'Content-Type':'text/plain;charset=utf-8'},body:JSON.stringify(Object.assign({action,token:CFG.token},payload||{}))})}
  catch(e){const er=new Error('No internet / cloud not reachable');er.offline=true;throw er}
  let j;try{j=await r.json()}catch(e){throw new Error('The cloud link did not answer properly — check the link and that the Apps Script is deployed with access “Anyone”.')}
  if(j&&j.auth&&action!=='login'){CFG.token=null;persist();refresh();toast(j.error||'Please sign in again')}
  return j;
}
async function apiOrToast(action,payload){
  try{const j=await api(action,payload);if(!j.ok&&!j.auth)toast(j.error||'Cloud error');return j}
  catch(e){toast(e.offline?'You are offline — this needs internet':e.message);return{ok:false,error:e.message}}
}

let pendingRender=false;
function softRefresh(){
  const a=document.activeElement;
  if(a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName)){pendingRender=true;renderHeader();return}
  refresh();
}
async function sync(manual){
  if(!signedIn()||SYNC.busy)return;
  SYNC.busy=true;SYNC.err='';renderHeader();
  let changed=false;
  try{
    let rounds=0;
    while(QUEUE.length&&rounds<5){
      rounds++;
      const batch=QUEUE.slice(0,150);
      const res=await api('push',{ops:batch});
      if(!res.ok){SYNC.err=res.error||'Sync failed';break}
      (res.results||[]).forEach(r=>{
        const op=QUEUE.find(q=>q.id===r.id);if(!op)return;
        QUEUE=QUEUE.filter(q=>q!==op);
        if(!r.ok)ISSUES.push({id:uid('i'),op,r,at:nowISO()});
      });
      CACHE={data:res.data,rev:res.rev,at:nowISO()};changed=true;
    }
    if(!QUEUE.length&&!SYNC.err){
      const res=await api('pull',{rev:CACHE&&CACHE.rev});
      if(res.ok){if(!res.same){CACHE={data:res.data,rev:res.rev,at:nowISO()};changed=true}else CACHE.at=nowISO()}
      else SYNC.err=res.error||'Sync failed';
    }
    SYNC.offline=false;SYNC.last=nowISO();
  }catch(e){SYNC.offline=!!e.offline;SYNC.err=e.offline?'':e.message}
  finally{
    SYNC.busy=false;persist();
    if(changed){buildView();softRefresh()}else renderHeader();
    if(manual)toast(SYNC.offline?'Offline — changes are kept and will upload later':SYNC.err?SYNC.err:'Synced with cloud ✓');
    if(ISSUES.length&&changed&&!$('#modal').classList.contains('on'))openIssues();
  }
}
setInterval(()=>{if(!document.hidden)sync()},45000);
window.addEventListener('online',()=>sync());
document.addEventListener('visibilitychange',()=>{if(!document.hidden)sync()});
window.addEventListener('focusout',()=>{if(pendingRender)setTimeout(()=>{const a=document.activeElement;if(!(a&&$('#main').contains(a)&&/INPUT|TEXTAREA|SELECT/.test(a.tagName))){pendingRender=false;refresh()}},150)});

/* ============ formatting ============ */
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const nf=new Intl.NumberFormat('en-IN',{maximumFractionDigits:2}),nf2=new Intl.NumberFormat('en-IN',{minimumFractionDigits:2,maximumFractionDigits:2});
const money=v=>{if(v==null||v==='')return'—';const a=Math.abs(Math.round(v*100)/100);return(v<0&&a?'−':'')+'₹'+(Number.isInteger(a)?nf:nf2).format(a)};
const num=v=>nf.format(v||0);
const MON=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const fmtDate=s=>{if(!s)return'—';const[y,m,d]=s.split('-');return d+'-'+MON[+m-1]+'-'+y};
const monthLabel=k=>k==='undated'?'Undated':MON[+k.slice(5,7)-1]+' '+k.slice(0,4);
const daysBetween=(a,b)=>Math.round((Date.parse(b)-Date.parse(a))/864e5);
const relDays=iso=>{const d=Math.floor((Date.now()-Date.parse(iso))/864e5);return d<=0?'today':d===1?'yesterday':d+' days ago'};
const digits=s=>String(s||'').replace(/\D/g,'');
const phoneKey=s=>{const d=digits(s);return d.length>=10?d.slice(-10):d};
function waNum(p){const d=digits(p);if(d.length===10)return'91'+d;return d}
const r2=v=>Math.round(v*100)/100;

/* ============ calculations (mirror of the Excel formulas) ============ */
function prodName(it){const p=DB.products.find(p=>p.id===it.pid);return p?p.name:(it.name||'?')}
function calc(o){
  const items=o.items.filter(i=>+i.qty>0);
  const units=items.reduce((s,i)=>s+(+i.qty),0);
  const listValue=r2(items.reduce((s,i)=>s+(+i.qty)*(+i.rate||0),0));
  const itemDisc=r2(items.reduce((s,i)=>s+lineDisc(i),0));
  const hasOv=o.override!==null&&o.override!==undefined&&o.override!=='';
  const disc=+o.disc||0,flat=+o.flat||0;
  const amount=hasOv?+o.override:(listValue?r2(Math.max(0,(listValue-itemDisc)*(1-disc/100)-flat)):null);
  const received=r2((o.payments||[]).reduce((s,p)=>s+(+p.amount||0),0));
  const st=o.status||'';const cancelled=st==='Cancelled';
  const balance=amount==null?null:(cancelled?0:r2(amount-received));
  const pay=amount==null?'Amount TBC':cancelled?'n/a':balance<=0?'Paid':received>0?'Part paid':'Unpaid';
  const overpaid=!cancelled&&amount!=null&&balance<-0.5;
  const daysOpen=(o.date&&st!=='Delivered'&&!cancelled)?daysBetween(o.date,today()):null;
  let next;
  if(cancelled)next='Closed';
  else if(amount==null)next='Confirm amount';
  else if(st==='Delivered'&&pay==='Paid')next='Complete';
  else if(!st)next='Set delivery status';
  else if(st==='Delivered')next='Collect payment';
  else{const d=st==='Dispatched'?'Awaiting delivery':st==='Part Delivered'?'Deliver balance qty':'Dispatch order';next=pay==='Paid'?d:d+' + collect payment'}
  const open=next!=='Complete'&&next!=='Closed';
  const discount=amount!=null&&listValue?r2(listValue-amount):0;
  return{units,itemDisc,listValue,amount,received,balance,pay,overpaid,daysOpen,next,open,cancelled,discount,status:st,hasOv};
}
// Per-item discount: 'unit' = ₹ off each unit, 'pct' = % off this line
function lineDisc(i){const q=+i.qty||0,r=+i.rate||0,v=+i.dval||0;if(!q||!v)return 0;return i.dkind==='pct'?r2(q*r*Math.min(v,100)/100):i.dkind==='unit'?r2(q*Math.min(v,r)):0}
const lineDiscTxt=i=>!(+i.dval)?'':i.dkind==='pct'?'−'+i.dval+'%':i.dkind==='unit'?'−'+money(+i.dval)+'/unit':'';
function chanBadge(o){return o.channel==='Online'?'<span class="b info">🌐 Online</span>':o.channel==='Offline'?'<span class="b violet">🏬 Offline</span>':''}
function itemQtyState(o,it){
  const q=+it.qty||0,st=o.status||'';
  const r={sold:0,delivered:0,dispatched:0,toDispatch:0,notSet:0};
  if(st==='Cancelled'||!q)return r;r.sold=q;
  if(st==='Delivered')r.delivered=q;else if(st==='Dispatched')r.dispatched=q;else if(st==='Yet to Deliver')r.toDispatch=q;
  else if(st==='Part Delivered'){const d=Math.min(q,+it.dlv||0);r.delivered=d;r.toDispatch=q-d}else r.notSet=q;
  return r;
}
const itemsText=o=>o.items.filter(i=>+i.qty>0).map(i=>i.qty+' × '+prodName(i)).join(', ')||'—';
const nextNo=()=>DB.orders.reduce((m,o)=>Math.max(m,+o.no||0),0)+1;
const byId=id=>DB.orders.find(o=>o.id===id);
const hasCheck=o=>/(^|\|)\s*CHECK/i.test(o.notes||'');
const custKey=o=>phoneKey(o.phone)||('n:'+String(o.customer||'').toLowerCase().trim());
const normName=s=>String(s||'').toLowerCase().replace(/\(.*?\)/g,'').replace(/\bji\b/g,'').replace(/[^a-z]/g,'');

/* ============ badges ============ */
function delBadge(s){if(!s)return'<span class="b warn">Status not set</span>';const c={Delivered:'ok',Dispatched:'info','Yet to Deliver':'warn','Part Delivered':'violet',Cancelled:''}[s];return`<span class="b ${c}">${esc(s)}</span>`}
function payBadge(p){const c={Paid:'ok','Part paid':'info',Unpaid:'bad','Amount TBC':'warn','n/a':''}[p];return`<span class="b ${c}">${esc(p)}</span>`}
function nextBadge(n){const c=n==='Complete'?'ok':n==='Closed'?'':/collect/i.test(n)?'bad':/confirm|set/i.test(n)?'warn':'info';return`<span class="b ${c}">${esc(n)}</span>`}
function ageBadge(d){if(d==null)return'';const c=d>15?'bad':d>7?'warn':'ok';return`<span class="b ${c}">${d}d open</span>`}

const CHECKS=[

  {id:'sharedphone',label:'Same phone used by different names',lvl:'warn',t:(o,c,x)=>{const k=phoneKey(o.phone);return k.length===10&&x.ph[k]&&x.ph[k].size>1}},
  {id:'lowprice',label:'Price far below list (>40% off, no discount entered)',lvl:'warn',t:(o,c)=>c.amount!=null&&c.listValue>0&&c.amount<c.listValue*0.6&&!(+o.disc)&&!(+o.flat)&&!c.itemDisc&&!/%|off/i.test(o.offer||'')},
  {id:'overpaid',label:'Received more than order amount',lvl:'bad',t:(o,c)=>c.overpaid},

/* ============ drill-down registry ============ */
function drill(k,v){
  const C=o=>calc(o);
  const nc=o=>!C(o).cancelled;
  switch(k){
    case'all':return{t:'All orders (excl. cancelled)',f:nc};
    case'every':return{t:'Every order',f:()=>true};
    case'units':return{t:'Orders with units sold',f:o=>nc(o)&&C(o).units>0};
    case'billed':return{t:'Billed orders',f:o=>nc(o)&&C(o).amount!=null};
    case'received':return{t:'Orders with payments received',f:o=>nc(o)&&C(o).received>0};
    case'due':return{t:'Orders with balance due',f:o=>C(o).balance>0};
    case'open':return{t:'Open orders (To Do)',f:o=>C(o).open};
    case'del':return{t:v?'Delivery: '+v:'Delivery status not set',f:o=>(o.status||'')===v};
    case'pay':return{t:'Payment: '+v,f:o=>C(o).pay===v};
    case'prod':{const p=DB.products.find(p=>p.id===v);return{t:'Orders with '+(p?p.name:v),f:o=>nc(o)&&o.items.some(i=>i.pid===v&&+i.qty>0)}}
    case'pstate':{const[pid,b]=v.split('|');const p=DB.products.find(p=>p.id===pid);const lbl={delivered:'delivered',dispatched:'dispatched (in transit)',toDispatch:'to dispatch',notSet:'status not set',sold:'sold'}[b];
      return{t:(p?p.name:pid)+' — '+lbl,f:o=>o.items.some(i=>i.pid===pid&&itemQtyState(o,i)[b]>0)}}
    case'pending':return{t:'Orders with units still to dispatch',f:o=>o.items.some(i=>itemQtyState(o,i).toDispatch>0)};
    case'month':return{t:'Orders in '+monthLabel(v),f:o=>nc(o)&&(v==='undated'?!o.date:(o.date||'').slice(0,7)===v)};
    case'mode':return{t:'Payments by '+(v||'(no mode)'),f:o=>nc(o)&&(o.payments||[]).some(p=>(p.mode||'')===v)};
    case'offer':return{t:'Offer: '+(v||'(none)'),f:o=>nc(o)&&(o.offer||'')===v};
    case'chan':return{t:v?v+' orders':'Order type not set',f:o=>nc(o)&&(o.channel||'')===v};
    case'disc':return{t:'Orders sold below list value',f:o=>nc(o)&&C(o).discount>0.5};
    case'check':{const ck=CHECKS.find(c=>c.id===v);const x=buildCtx();return{t:ck.label,f:o=>ck.t(o,C(o),x)}}
    case'age':{const[a,b]=v.split('-').map(Number);return{t:'Open '+(b?a+'–'+b:a+'+')+' days',f:o=>{const c=C(o);return c.open&&c.daysOpen!=null&&c.daysOpen>=a&&(!b||c.daysOpen<=b)}}}
    case'cust':return{t:'Customer orders',f:o=>custKey(o)===v};
  }
  return{t:'Orders',f:()=>true};
}

/* ============ Dashboard ============ */
function dashView(){
  const rows=DB.orders.map(o=>({o,c:calc(o)}));const live=rows.filter(r=>!r.c.cancelled);
  const sum=(a,f)=>a.reduce((s,r)=>s+(f(r)||0),0);
  const billed=sum(live,r=>r.c.amount),rec=sum(live,r=>r.c.received),due=sum(rows,r=>r.c.balance>0?r.c.balance:0);
  const units=sum(live,r=>r.c.units),open=rows.filter(r=>r.c.open).length;
  const pending=rows.reduce((s,r)=>s+r.o.items.reduce((a,i)=>a+itemQtyState(r.o,i).toDispatch,0),0);
  const kpi=(l,v,s,act,cls='')=>`<button class="kpi ${cls}" ${act}><div class="l">${l}</div><div class="v">${v}</div><div class="s">${s}</div></button>`;
  let h=`<div class="pagehead"><div class="grow"><h2>Dashboard</h2><div class="muted small">As of ${fmtDate(today())} · cancelled orders excluded · <b>click any number to see the orders behind it</b></div></div></div>
  <div class="kpis">
   ${kpi('Orders',num(live.length),live.filter(r=>r.o.channel==='Online').length+' online · '+live.filter(r=>r.o.channel==='Offline').length+' offline','data-act="drill" data-k="all"')}
   ${kpi('Units sold',num(units),num(pending)+' still to dispatch','data-act="drill" data-k="units"')}
   ${kpi('Sales billed',money(billed),'order amounts','data-act="drill" data-k="billed"')}
   ${kpi('Received',money(rec),billed?Math.round(rec/billed*100)+'% collected':'','data-act="drill" data-k="received"','accent')}
   ${kpi('Balance due',money(due),rows.filter(r=>r.c.balance>0).length+' orders','data-act="drill" data-k="due"','bad')}
   ${kpi('Open orders',num(open),'need action','data-act="tab" data-tab="todo"')}
   ${kpi('Next order no',nextNo(),'auto-filled on new order','data-act="new-order"','static')}
  </div><div class="grid g2">`;

  // order type
  {const ct=['Online','Offline',''].map(v=>({v,rs:live.filter(r=>(r.o.channel||'')===v)})).filter(x=>x.v||x.rs.length);

  h+=top.length?top.map(c=>`<tr class="click" data-act="open-cust" data-k="${esc(c.k)}"><td><b>${esc(c.name)}</b><div class="small muted">${esc(c.phone||'no phone')}</div></td><td class="num">${c.n}</td><td class="num" style="color:var(--bad);font-weight:700">${money(c.bal)}</td></tr>`).join(''):`<tr><td colspan="3" class="nodata">Nothing to collect 🎉</td></tr>`;
  h+=`</tbody></table></div></div>`;

  // ageing
  const ag=[['0-7','0–7 days'],['8-15','8–15 days'],['16-30','16–30 days'],['31','Over 30 days']];
  h+=`<div class="card"><div class="ch"><h3>Open orders by age</h3><span class="muted small grow">days since order date</span></div><div class="tw"><table><thead><tr><th>Age</th><th class="num">Orders</th><th class="num">Balance</th></tr></thead><tbody>`;
  ag.forEach(([v,l])=>{const d=drill('age',v);const rs=rows.filter(r=>d.f(r.o));h+=`<tr class="click" data-act="drill" data-k="age" data-v="${v}"><td>${l}</td><td class="num">${rs.length}</td><td class="num">${money(sum(rs,r=>r.c.balance>0?r.c.balance:0))}</td></tr>`});
  const und=rows.filter(r=>r.c.open&&r.c.daysOpen==null&&r.c.status!=='Delivered').length;
  h+=`</tbody></table></div>${und?`<div class="cb small muted">+ ${und} open order(s) without an order date — see Data checks.</div>`:''}</div>`;

  // payment modes
  const pm={};live.forEach(r=>(r.o.payments||[]).forEach(p=>{const k=p.mode||'';pm[k]=pm[k]||{n:new Set(),amt:0};pm[k].n.add(r.o.id);pm[k].amt+=+p.amount||0}));
  h+=`<div class="card"><div class="ch"><h3>Money received by mode</h3></div><div class="tw"><table><thead><tr><th>Mode</th><th class="num">Orders</th><th class="num">Amount</th></tr></thead><tbody>`;
  const pmk=Object.keys(pm).sort((a,b)=>pm[b].amt-pm[a].amt);
  h+=pmk.length?pmk.map(k=>`<tr class="click" data-act="drill" data-k="mode" data-v="${esc(k)}"><td>${esc(k||'(no mode)')}</td><td class="num">${pm[k].n.size}</td><td class="num">${money(pm[k].amt)}</td></tr>`).join(''):`<tr><td colspan="3" class="nodata">No payments yet</td></tr>`;
  h+=`</tbody></table></div></div>`;

  // offers / discounts
  const ofr={};live.forEach(r=>{const k=r.o.offer||'';ofr[k]=ofr[k]||{n:0,disc:0};ofr[k].n++;ofr[k].disc+=r.c.discount>0?r.c.discount:0});

  // data checks
  const x=buildCtx();

  CHECKS.forEach(ck=>{const n=rows.filter(r=>ck.t(r.o,r.c,x)).length;
    h+=`<tr class="${n?'click':''}" ${n?`data-act="drill" data-k="check" data-v="${ck.id}"`:''}><td>${ck.label}</td><td class="num">${n?`<span class="b ${ck.lvl}">${n}</span>`:'<span class="zero">0</span>'}</td></tr>`});
  const gaps=orderGaps();
  h+=`<tr class="${gaps.length?'click':''}" ${gaps.length?'data-act="gaps"':''}><td>Skipped order numbers</td><td class="num">${gaps.length?`<span class="b warn">${gaps.length}</span>`:'<span class="zero">0</span>'}</td></tr>`;
  h+=`</tbody></table></div></div>`;
  h+=`</div>`;
  return h;
}

  ['late','Open > 7 days',c=>c.open&&c.daysOpen>7],
];

  <div class="notice"><span>Showing <b>${list.length}</b> order(s) · balance to collect <b style="color:var(--bad)">${money(due)}</b>${Object.keys(pend).length?' · to dispatch: '+Object.entries(pend).map(([p,q])=>`<b>${q} × ${esc(prodName({pid:p}))}</b>`).join(', '):''}</span></div><div class="todo">`;
  if(!list.length)h+=`<div class="card nodata">Nothing here — all caught up ✓</div>`;

      <div class="acts">${quickActions(o,c)}</div></div>`});

function quickActions(o,c,big){
  const a=[];const sm=big?'':'sm';
  if(!c.cancelled){
    if(c.status!=='Dispatched'&&c.status!=='Delivered')a.push(`<button class="btn ${sm}" data-act="set-status" data-id="${o.id}" data-s="Dispatched">🚚 Mark dispatched</button>`);
    if(c.status!=='Delivered')a.push(`<button class="btn ${sm}" data-act="set-status" data-id="${o.id}" data-s="Delivered">✓ Mark delivered</button>`);
    if(c.balance>0||c.amount!=null)a.push(`<button class="btn ${sm} ${c.balance>0?'primary':''}" data-act="pay-order" data-id="${o.id}">₹ Record payment</button>`);
    if(c.amount==null)a.push(`<button class="btn ${sm} primary" data-act="edit-order" data-id="${o.id}">Confirm amount</button>`);
  }
  const ph=waNum(o.phone);
  if(ph.length>=10){
    a.push(`<a class="btn ${sm}" target="_blank" rel="noopener" href="https://wa.me/${ph}?text=${encodeURIComponent(waText(o,c))}">💬 WhatsApp</a>`);
    a.push(`<a class="btn ${sm}" href="tel:+${ph}">📞 Call</a>`);
  }
  if(!big)a.push(`<button class="btn ${sm} ghost" data-act="open-order" data-id="${o.id}">Details →</button>`);
  return a.join('');
}

const waTpl=k=>{const w=(DB.lists.wa||{})[k];return w&&String(w).trim()?w:WA_DEFAULT[k]};
const waFill=(t,v)=>String(t).replace(/\{(\w+)\}/g,(m,k)=>k in v?v[k]:m);
const cleanName=n=>String(n||'').replace(/\s*\(.*?\)\s*/g,' ').trim();
function orderVars(o,c){return{name:cleanName(o.customer),no:o.no,date:fmtDate(o.date),items:itemsText(o),amount:money(c.amount),received:money(c.received),balance:money(c.balance),status:c.status||'being processed',type:o.channel||'',phone:o.phone||''}}
function waText(o,c,key){return waFill(waTpl(key||(c.balance>0?'pay':'update')),orderVars(o,c))}

/* ============ Orders table ============ */
function filteredOrders(){
  const f=UI.of,q=f.q.trim().toLowerCase(),qd=digits(q);
  const d=f.drill?drill(f.drill.k,f.drill.v):null;
  return DB.orders.map(o=>({o,c:calc(o)})).filter(({o,c})=>{
    if(d&&!d.f(o))return false;
    if(q){const hay=(o.no+' '+o.customer+' '+o.phone+' '+o.notes+' '+o.offer+' '+itemsText(o)).toLowerCase();
      if(!(hay.includes(q)||(qd.length>=3&&digits(o.phone).includes(qd))||String(o.no)===q.replace('#','')))return false}
    if(f.del!=='*'&&(o.status||'')!==f.del)return false;
    if(f.pay!=='*'&&c.pay!==f.pay)return false;
    if(f.month!=='*'&&(f.month==='undated'?o.date:(o.date||'').slice(0,7)!==f.month))return false;
    if(f.chan&&f.chan!=='*'&&(o.channel||'')!==f.chan)return false;
    if(f.prod!=='*'&&!o.items.some(i=>i.pid===f.prod&&+i.qty>0))return false;
    if(f.open&&!c.open)return false;
    return true});
}

/* ============ Customers ============ */
function customerGroups(){
  const g={};const mk=k=>g[k]=g[k]||{k,names:new Map(),phone:'',orders:[],units:0,billed:0,rec:0,bal:0,last:'',open:0,cust:null};
  DB.orders.forEach(o=>{const c=calc(o),x=mk(custKey(o));
    x.names.set(normName(o.customer),o.customer);x.orders.push(o);if(!x.phone&&o.phone)x.phone=o.phone;
    if(!c.cancelled){x.units+=c.units;x.billed+=c.amount||0;x.rec+=c.received}
    if(c.balance>0)x.bal+=c.balance;if(c.open)x.open++;if((o.date||'')>x.last)x.last=o.date||''});
  (DB.customers||[]).forEach(c=>{const x=mk(phoneKey(c.phone)||('n:'+String(c.name||'').toLowerCase().trim()));
    x.cust=c;if(c.phone)x.phone=x.phone||c.phone;if(!x.names.size)x.names.set(normName(c.name),c.name)});
  return Object.values(g).map(x=>{x.name=x.cust?x.cust.name:[...x.names.values()][0];x.alias=[...x.names.values()].filter(n=>normName(n)!==normName(x.name));return x});
}
function findCustomer(name,phone){
  const pk=phoneKey(phone),nm=String(name||'').trim().toLowerCase();
  return (DB.customers||[]).find(c=>(pk.length===10&&phoneKey(c.phone)===pk)||(String(c.name||'').trim().toLowerCase()===nm&&(!pk||!phoneKey(c.phone))));
}
function ensureCustomer(name,phone){
  if(!String(name||'').trim()||findCustomer(name,phone))return;
  queueOp({type:'customer.add',customer:{id:uid('c'),name:String(name).trim(),phone:String(phone||'').trim(),place:'',notes:''}});
}

/* ============ sync issues (conflicts) ============ */
function opText(op){
  const o=op.order||byId(op.orderId)||{};
  const t={'order.upsert':op.create?'New order':'Edit of order','order.delete':'Delete of order','order.status':'Status change on order','order.patch':'Update of order','payment.add':'Payment on order','payment.del':'Payment removal on order','customer.add':'New customer','customer.update':'Edit of customer','customer.delete':'Delete of customer','master.set':'Change of products / lists'}[op.type]||op.type;
  if(op.customer)return t+' '+op.customer.name;
  return t+(o.no?' #'+o.no:'')+(o.customer?' · '+o.customer:'');
}
function shortOrder(o,other){if(!o)return'—';const c=calc(o);let t=`#${o.no} · ${esc(o.customer)} · ${esc(itemsText(o))} · ${money(c.amount)} · ${esc(o.status||'status not set')} · received ${money(c.received)}`;
  if(other){const x=[];['date','phone','offer','disc','flat','override','deliveryDate','notes','payMode'].forEach(k=>{if(String(o[k]??'')!==String(other[k]??''))x.push(k==='notes'?'notes: “'+esc(String(o.notes||'—').slice(0,80))+'”':k+': '+esc(o[k]||'—'))});if(x.length)t+=' · <b>'+x.join(' · ')+'</b>'}
  return t}
function openIssues(){
  const main=ISSUES.filter(x=>!x.r.waitFor);
  const deps=id=>ISSUES.filter(x=>x.r.waitFor&&x.r.waitFor===id).length;
  if(!ISSUES.length){closeModal();toast('No sync issues');return}
  openModal(`<div class="mh"><h3>Sync issues (${ISSUES.length})</h3><button class="iconbtn" data-act="modal-close">✕</button></div>
  <div class="mb"><p class="muted small" style="margin-top:0">These changes reached the cloud but could not be applied as they were. Pick a fix — nothing is lost until you choose “Discard”.</p>
  ${main.map(is=>{const op=is.op,r=is.r,o=op.order||{},oid=op.orderId||o.id,dn=deps(oid);let body='',btns='';
    if(r.conflict==='dupNo'){const nx=Math.max(nextNo(),r.nextNo||0);
      body=`Your ${op.create?'new order':'order'} <b>${esc(o.customer)}</b> (${esc(itemsText(o))}) uses <b>#${o.no}</b>, but that number is already taken${r.takenBy?' by <b>'+esc(r.takenBy)+'</b>':''}.`;
      btns=`<button class="btn primary" data-act="iss-fix" data-i="${is.id}" data-how="next" data-v="${nx}">Use #${nx} (next free)</button><span class="listrow"><input type="number" id="pick_${is.id}" placeholder="other no." style="width:110px;padding:6px 8px;border:1px solid var(--border2);border-radius:7px;background:var(--surface)"><button class="btn" data-act="iss-fix" data-i="${is.id}" data-how="pick">Use this number</button></span><button class="btn danger" data-act="iss-fix" data-i="${is.id}" data-how="discard">Discard my order</button>`}
    else if(r.conflict==='edited'){
      body=`<b>${esc(opText(op))}</b> — ${esc(r.error)}<div class="small" style="margin-top:6px"><div><b>Their version:</b> ${shortOrder(r.server,o)}</div><div><b>Your version:</b> ${shortOrder(o,r.server)}</div></div>`;
      btns=`<button class="btn primary" data-act="iss-fix" data-i="${is.id}" data-how="mine">Keep my version</button><button class="btn" data-act="iss-fix" data-i="${is.id}" data-how="discard">Keep their version</button>`}
    else if(r.conflict==='gone'&&op.type==='order.upsert'){
      body=`<b>${esc(opText(op))}</b> — ${esc(r.error)}`;
      btns=`<button class="btn primary" data-act="iss-fix" data-i="${is.id}" data-how="recreate">Re-create it with my changes</button><button class="btn" data-act="iss-fix" data-i="${is.id}" data-how="discard">Leave it deleted</button>`}
    else{body=`<b>${esc(opText(op))}</b> — ${esc(r.error||'Could not be applied')}`;btns=`<button class="btn" data-act="iss-fix" data-i="${is.id}" data-how="discard">Dismiss</button>`}
    return`<div class="card" style="margin-bottom:10px;border-left:4px solid var(--bad)"><div class="cb"><div class="small faint">${new Date(is.at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})} · by ${esc(op.by||'')}</div><div style="margin:6px 0 10px">${body}${dn?`<div class="small muted" style="margin-top:6px">+ ${dn} linked change(s) (payment / status) will follow automatically.</div>`:''}</div><div class="actions">${btns}</div></div></div>`}).join('')}
  </div><div class="mf"><button class="btn" data-act="modal-close">Close</button></div>`);
}
function fixIssue(iid,how,val){
  const is=ISSUES.find(x=>x.id===iid);if(!is)return;
  const op=clone(is.op),oid=op.orderId||(op.order&&op.order.id);
  const deps=ISSUES.filter(x=>x!==is&&x.r.waitFor&&x.r.waitFor===oid);
  ISSUES=ISSUES.filter(x=>x!==is&&!deps.includes(x));
  if(how!=='discard'){
    if(how==='next'||how==='pick'){const n=parseInt(val,10);if(!n||n<1){ISSUES.push(is,...deps);toast('Enter a valid order number');return}op.order.no=n}
    if(how==='mine')op.force=true;
    if(how==='recreate'){op.create=true;op.force=true}
    op.id=uid('op');QUEUE.push(op);
    deps.forEach(dp=>{const o2=clone(dp.op);o2.id=uid('op');QUEUE.push(o2)});
  }
  persist();buildView();refresh();
  if(ISSUES.length)openIssues();else closeModal();
  if(how!=='discard')sync();
}

  if(LOGS===null){loadLogs();return`<div class="pagehead"><div class="grow"><h2>Activity log</h2></div></div><div class="card nodata">Loading the log from the cloud…</div>`}
  const users=[...new Set(LOGS.map(e=>e.user))].sort(),acts=[...new Set(LOGS.map(e=>e.act))].sort();
  const q=LOGF.q.toLowerCase(),cut=LOGF.days==='*'?'':new Date(Date.now()-(+LOGF.days)*864e5).toISOString();
  const rows=LOGS.filter(e=>(LOGF.user==='*'||e.user===LOGF.user)&&(LOGF.act==='*'||e.act===LOGF.act)&&(!cut||e.at>=cut)&&(!q||(e.ref+' '+e.detail+' '+e.act+' '+e.user).toLowerCase().includes(q)));
  const opt=(v,l,cur)=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(l)}</option>`;
  const actC=a=>/deleted|removed|DELETED|cleared/i.test(a)?'bad':/created|added|restored/i.test(a)?'ok':/Payment/.test(a)?'info':/Signed/.test(a)?'':'warn';
  let h=`<div class="pagehead"><div class="grow"><h2>Activity log</h2><div class="muted small">Who did what and when — written by the cloud, so it can't be edited from the tool. ${LOGS.length} entries kept.</div></div><button class="btn" data-act="log-reload">⟳ Reload</button></div>
  ${LOGERR?`<div class="notice" style="color:var(--bad)">${esc(LOGERR)}</div>`:''}
  <div class="filters">
   <input type="search" id="logq" placeholder="Search order no, customer, detail…" value="${esc(LOGF.q)}" style="min-width:220px">
   <select data-logf="user">${opt('*','All users',LOGF.user)}${users.map(u=>opt(u,u,LOGF.user)).join('')}</select>
   <select data-logf="act">${opt('*','All actions',LOGF.act)}${acts.map(a=>opt(a,a,LOGF.act)).join('')}</select>
   <select data-logf="days">${opt('*','Any time',LOGF.days)}${[['1','Last 24 hours'],['7','Last 7 days'],['30','Last 30 days'],['90','Last 90 days']].map(([v,l])=>opt(v,l,LOGF.days)).join('')}</select>
  </div>
  <div class="card"><div class="tw"><table><thead><tr><th style="width:150px">When</th><th>User</th><th>Action</th><th>Order / item</th><th>Details</th><th></th></tr></thead><tbody>`;
  h+=rows.slice(0,LOGLIMIT).map(e=>`<tr><td class="small" style="white-space:nowrap">${new Date(e.at).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'})}</td><td><b>${esc(e.user)}</b></td><td><span class="b ${actC(e.act)}">${esc(e.act)}</span></td><td>${esc(e.ref||'')}</td><td class="small">${esc(e.detail||'')}</td><td>${e.snap&&e.act==='Order deleted'&&!byId(e.snap.id)?`<button class="btn sm" data-act="log-restore" data-id="${esc(e.id)}">Restore order</button>`:''}${e.snap&&e.act==='Customer deleted'&&!(DB.customers||[]).some(c=>c.id===e.snap.id)?`<button class="btn sm" data-act="log-restore-cust" data-id="${esc(e.id)}">Restore</button>`:''}</td></tr>`).join('')||`<tr><td colspan="6" class="nodata">No log entries match.</td></tr>`;
  h+=`</tbody></table></div>${rows.length>LOGLIMIT?`<div class="cb"><button class="btn sm" data-act="log-more">Show more (${rows.length-LOGLIMIT} older)</button></div>`:''}</div>
  <div class="card" style="margin-top:14px"><div class="ch"><h3>🧹 Clear old log entries</h3></div><div class="cb"><div class="listrow">
   <span>Remove entries older than</span>
   <select id="clearDays" style="padding:7px 10px;border:1px solid var(--border2);border-radius:8px;background:var(--surface)"><option value="10">10 days</option><option value="30">1 month</option><option value="60" selected>2 months</option><option value="180">6 months</option><option value="365">1 year</option></select>
   <button class="btn danger" data-act="log-clear">Clear older entries</button></div>
   <p class="small muted" style="margin-bottom:0">Removed entries are not destroyed — they are moved to a file in Google Drive › PEPAL Order Desk Cloud › log-archive, so a yearly split happens just by clearing entries older than 1 year.</p></div></div>`;
  return h;
}

function summarize(d){
  const save=DB;DB=normalizeDB(d);try{
    const rows=DB.orders.map(o=>({o,c:calc(o)})),live=rows.filter(r=>!r.c.cancelled);
    const ds=DB.orders.map(o=>o.date).filter(Boolean).sort();
    return{orders:DB.orders.length,customers:new Set(DB.orders.map(custKey).concat((DB.customers||[]).map(c=>phoneKey(c.phone)||'n:'+String(c.name).toLowerCase().trim()))).size,billed:live.reduce((s,r)=>s+(r.c.amount||0),0),
      received:live.reduce((s,r)=>s+r.c.received,0),due:rows.reduce((s,r)=>s+(r.c.balance>0?r.c.balance:0),0),open:rows.filter(r=>r.c.open).length,

let modalOnClose=null;
function openModal(html,cls=''){const m=$('#modal');m.innerHTML=`<div class="mbox ${cls}" role="dialog">${html}</div>`;m.classList.add('on');setTimeout(()=>{const f=m.querySelector('[autofocus]');if(f)f.focus()},30)}

function confirmBox(title,body,ok='OK',danger=false,typeWord=null){
  return new Promise(res=>{
    openModal(`<div class="mh"><h3>${esc(title)}</h3></div><div class="mb">${body}${typeWord?`<div class="field" style="margin-top:10px"><label>Type <b>${typeWord}</b> to confirm</label><input id="cfType" autofocus></div>`:''}</div>

function stamp(){const d=new Date();return today()+'_'+String(d.getHours()).padStart(2,'0')+String(d.getMinutes()).padStart(2,'0')}
function download(name,blob){const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function compareSummary(cur,inc,curLbl,incLbl){
  const a=summarize(cur),b=summarize(inc);
  const rowsDef=[['Orders','orders',v=>v],['Customers','customers',v=>v],['Order no. range','maxNo',(v,x)=>x.orders?'1 – '+v:'—'],['Date range','first',(v,x)=>x.first?fmtDate(x.first)+' → '+fmtDate(x.last):'—'],['Sales billed','billed',money],['Received','received',money],['Balance due','due',money],['Open orders','open',v=>v],['Payments recorded','payments',v=>v],['Last edited','updated',v=>v?new Date(v).toLocaleString('en-IN',{dateStyle:'medium',timeStyle:'short'}):'—']];
  // diff by order no
  const ma=new Map(cur.orders.map(o=>[+o.no,o])),mb=new Map(inc.orders.map(o=>[+o.no,o]));
  const onlyB=[...mb.keys()].filter(k=>!ma.has(k)).sort((x,y)=>x-y),onlyA=[...ma.keys()].filter(k=>!mb.has(k)).sort((x,y)=>x-y);
  const sig=o=>JSON.stringify([o.date,o.customer,o.phone,o.items.map(i=>[i.pid,+i.qty,+i.rate,+i.dlv||0]),o.disc,o.flat,o.override,o.status,o.deliveryDate,(o.payments||[]).map(p=>[p.date,p.mode,+p.amount]),o.notes]);
  const changed=[...mb.keys()].filter(k=>ma.has(k)&&sig(ma.get(k))!==sig(mb.get(k))).sort((x,y)=>x-y);
  const list=a=>a.length?a.slice(0,40).map(n=>'#'+n).join(', ')+(a.length>40?' …+'+(a.length-40):''):'none';
  return`<div class="tw"><table class="cmp"><thead><tr><th></th><th class="num">${curLbl}</th><th class="num">${incLbl}</th></tr></thead><tbody>${rowsDef.map(([l,k,f])=>{const va=f(a[k],a),vb=f(b[k],b);return`<tr><td>${l}</td><td class="num">${va}</td><td class="num ${va!==vb&&k!=='updated'?'diff':''}">${vb}</td></tr>`}).join('')}
   <tr><td>Products</td><td class="small">${esc(a.products||'—')}</td><td class="small">${esc(b.products||'—')}</td></tr></tbody></table></div>
   <div class="fsec">Order-level differences</div>
   <div class="small"><p style="margin:4px 0"><span class="b ok">${onlyB.length}</span> only in ${incLbl.toLowerCase()}: ${list(onlyB)}</p>
   <p style="margin:4px 0"><span class="b warn">${changed.length}</span> different in both: ${list(changed)}</p>
   <p style="margin:4px 0"><span class="b bad">${onlyA.length}</span> only in ${curLbl.toLowerCase()} (would be lost by “Replace”): ${list(onlyA)}</p></div>`;
}

/* ============ Excel import ============ */
function serialToISO(v){
  if(v==null||v==='')return'';
  if(typeof v==='number'){const p=XLSX.SSF.parse_date_code(v);if(!p)return'';return p.y+'-'+String(p.m).padStart(2,'0')+'-'+String(p.d).padStart(2,'0')}
  if(v instanceof Date)return v.getFullYear()+'-'+String(v.getMonth()+1).padStart(2,'0')+'-'+String(v.getDate()).padStart(2,'0');
  const s=String(v).trim();let m=s.match(/^(\d{4})-(\d{1,2})-(\d{1,2})/);if(m)return m[1]+'-'+m[2].padStart(2,'0')+'-'+m[3].padStart(2,'0');
  m=s.match(/^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{2,4})$/);if(m){const y=m[3].length===2?'20'+m[3]:m[3];return y+'-'+m[2].padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  m=s.match(/^(\d{1,2})[- ]([A-Za-z]{3})[a-z]*[- ](\d{4})$/);if(m){const mi=MON.findIndex(x=>x.toLowerCase()===m[2].toLowerCase());if(mi>=0)return m[3]+'-'+String(mi+1).padStart(2,'0')+'-'+m[1].padStart(2,'0')}
  return'';
}
const pslug=n=>'p_'+String(n).toLowerCase().replace(/[^a-z0-9]+/g,'_').replace(/^_|_$/g,'');
const isBlank=v=>v==null||String(v).trim()==='';
const toNum=v=>{if(isBlank(v))return null;if(typeof v==='number')return v;const n=parseFloat(String(v).replace(/[₹,\s]/g,''));return isNaN(n)?null:n};
function parseWorkbook(buf){
  const wb=XLSX.read(buf,{type:'array'});
  const sheetRows=n=>{const ws=wb.Sheets[n];return ws?XLSX.utils.sheet_to_json(ws,{header:1,raw:true,defval:null}):null};
  let oName=wb.SheetNames.find(n=>n.trim().toLowerCase()==='orders');
  if(!oName)oName=wb.SheetNames.find(n=>(sheetRows(n)||[]).slice(0,10).some(r=>r.some(c=>/order\s*no/i.test(String(c||'')))));
  if(!oName)throw new Error('Could not find an “Orders” sheet with an “Order No” column.');
  const rows=sheetRows(oName);const hi=rows.findIndex(r=>r.some(c=>/order\s*no/i.test(String(c||''))));
  const H=rows[hi].map(h=>String(h||'').replace(/\s+/g,' ').trim().toLowerCase());
  const col=re=>H.findIndex(h=>re.test(h));
  const C={no:col(/^order no/),date:col(/^order date/),cust:col(/^customer/),phone:col(/^phone|^mobile/),disc:col(/^discount/),flat:col(/^flat/),chan:col(/^order type|^type$|^channel/),offer:col(/^offer/),ov:col(/^amount override/),mode:col(/^payment mode/),rec:col(/^amount received/),status:col(/^delivery status/),ddate:col(/^delivery date/),notes:col(/^notes?$|^notes /)};
  if(C.cust<0)throw new Error('No “Customer” column found on '+oName+'.');
  const prodCols=[];rows[hi].forEach((h,i)=>{const s=String(h||'');if(/\(qty\)/i.test(s)){prodCols.push({i,name:s.split(/\n|\(qty\)/i)[0].trim()})}});
  // rates
  const rates={};const rr=sheetRows(wb.SheetNames.find(n=>n.trim().toLowerCase()==='rates')||'');
  if(rr)rr.slice(1).forEach(r=>{if(r&&!isBlank(r[0])&&typeof r[1]==='number')rates[String(r[0]).trim().toLowerCase()]={rate:r[1],note:r[2]?String(r[2]):''}});
  const products=prodCols.map(p=>({id:pslug(p.name),name:p.name,rate:(rates[p.name.toLowerCase()]||{}).rate||0,note:(rates[p.name.toLowerCase()]||{}).note||'',active:true}));
  // lists
  const lists={payModes:[],offers:[]};const lr=sheetRows(wb.SheetNames.find(n=>n.trim().toLowerCase()==='lists')||'');
  if(lr&&lr[0]){const lh=lr[0].map(h=>String(h||'').toLowerCase());const pi=lh.findIndex(h=>/payment mode/.test(h)),oi=lh.findIndex(h=>/offer/.test(h));
    lr.slice(1).forEach(r=>{if(pi>=0&&!isBlank(r[pi]))lists.payModes.push(String(r[pi]).trim());if(oi>=0&&!isBlank(r[oi])){lists.offers.push(parseOfferName(String(r[oi]).trim()))}})}
  // orders
  const orders=[],warn=[];let skipped=0;const g=(r,i)=>i>=0?r[i]:null;
  rows.slice(hi+1).forEach((r,ix)=>{
    if(!r)return;const no=toNum(g(r,C.no)),cust=g(r,C.cust);
    if(no==null&&isBlank(cust))return;
    if(isBlank(cust)){skipped++;warn.push('Row '+(hi+2+ix)+': no customer — skipped');return}
    const items=prodCols.map(p=>{const q=toNum(r[p.i]);const pr=products.find(x=>x.name===p.name);return q?{pid:pr.id,name:pr.name,qty:q,rate:pr.rate,dlv:0}:null}).filter(Boolean);
    let disc=toNum(g(r,C.disc));if(disc!=null&&disc<=1)disc=r2(disc*100);
    const status=isBlank(g(r,C.status))?'':String(g(r,C.status)).trim();
    const date=serialToISO(g(r,C.date)),ddate=serialToISO(g(r,C.ddate));
    const rec=toNum(g(r,C.rec)),mode=isBlank(g(r,C.mode))?'':String(g(r,C.mode)).trim();
    const o={id:uid('o'),no:no!=null?no:0,date,customer:String(cust).trim(),phone:isBlank(g(r,C.phone))?'':String(g(r,C.phone)).trim(),items,disc:disc??'',flat:toNum(g(r,C.flat))??'',channel:(v=>/^on/i.test(v)?'Online':/^off/i.test(v)?'Offline':'')(String(g(r,C.chan)||'')),offer:isBlank(g(r,C.offer))?'':String(g(r,C.offer)).trim(),
      override:toNum(g(r,C.ov))??'',payments:rec?[{id:uid('p'),date:ddate||date||today(),mode,amount:rec,ref:'Imported from Excel'}]:[],status,deliveryDate:ddate,notes:isBlank(g(r,C.notes))?'':String(g(r,C.notes)).trim(),payMode:mode,createdAt:nowISO(),updatedAt:nowISO(),log:[{at:nowISO(),msg:'Imported from Excel'}]};
    if(status==='Delivered')o.items.forEach(i=>i.dlv=i.qty);
    if(status&&!DELIVERY.includes(status))warn.push('#'+o.no+': unknown delivery status “'+status+'” kept as is');
    orders.push(o)});
  // fix missing / duplicate order numbers
  let mx=orders.reduce((m,o)=>Math.max(m,o.no),0);const seen=new Set();

}
function importPreview(res,fname){

   <li>“Amount Received” becomes one dated payment per order (date = delivery date or order date).</li>
   <li>${checkN} orders carry a CHECK note · ${tbr} have no override and are priced at list rates (were TBR).</li>
   ${res.warn.slice(0,12).map(w=>`<li style="color:var(--warn)">${esc(w)}</li>`).join('')}${res.warn.length>12?`<li>…and ${res.warn.length-12} more</li>`:''}
  </ul>
  <div class="fsec">How to import</div>
  <div class="radio">
   <label><input type="radio" name="imode" value="replace" ${has?'':'checked'}><div><b>Replace all data</b><div class="small muted">Start clean from this Excel (products, lists and orders).</div></div></label>
   ${has?`<label><input type="radio" name="imode" value="new" checked><div><b>Add only new order numbers</b><div class="small muted">Orders whose number already exists here are left untouched.</div></div></label>
   <label><input type="radio" name="imode" value="upsert"><div><b>Add new + overwrite matching numbers</b><div class="small muted">Excel wins for orders that exist in both (payments added here would be replaced).</div></div></label>`:''}
  </div><p class="small muted">A restore point of the current data is saved first.</p></div>
  <div class="mf"><button class="btn" data-act="modal-close">Cancel</button><button class="btn primary" id="i_ok">Import</button></div>`);
  $('#i_ok').onclick=async()=>{
    if(!needSynced())return;
    const mode=(document.querySelector('[name=imode]:checked')||{}).value||'replace';
    let T,note='';
    if(mode==='replace'){T=blankDB();T.products=res.products;T.orders=res.orders;
      if(res.lists.payModes.length)T.lists.payModes=res.lists.payModes;if(res.lists.offers.length)T.lists.offers=res.lists.offers}
    else{T=normalizeDB(clone(CACHE.data));
      res.products.forEach(p=>{if(!T.products.some(x=>x.id===p.id))T.products.push(p)});
      res.lists.payModes.forEach(x=>{if(!T.lists.payModes.includes(x))T.lists.payModes.push(x)});
      res.lists.offers.forEach(x=>{if(!T.lists.offers.some(y=>y.name===x.name))T.lists.offers.push(x)});
      const m=new Map(T.orders.map(o=>[+o.no,o]));let a=0,u=0;
      res.orders.forEach(o=>{const e=m.get(+o.no);if(!e){T.orders.push(o);a++}else if(mode==='upsert'){Object.assign(e,o,{id:e.id,log:e.log,v:(+e.v||0)+1});u++}});
      note=a+' orders added'+(u?', '+u+' overwritten':'')}
    const nc=addCustomersFromOrders(T);

}

function isoSerial(s){if(!s)return null;const[y,m,d]=s.split('-').map(Number);return(Date.UTC(y,m-1,d)-Date.UTC(1899,11,30))/864e5}
function exportXlsx(scope){
  if(typeof XLSX==='undefined')return toast('Excel library did not load — check internet connection.');
  const list=(scope==='filtered'?filteredOrders().map(r=>r.o):DB.orders.slice()).sort((a,b)=>a.no-b.no);
  const P=DB.products;
  const head=['Order No','Order Date','Order Type','Customer','Phone',...P.map(p=>p.name+'\n(qty)'),'Total Units','List Value (₹)','Item Discounts (₹)','Discount %','Flat Discount (₹)','Offer / Reason','Amount Override (₹)','Order Amount (₹)','Payment Mode','Amount Received (₹)','Balance Due (₹)','Payment Status','Delivery Status','Delivery Date','Days Open','Next Action','Notes'];
  const aoa=[head];
  list.forEach(o=>{const c=calc(o);aoa.push([o.no,isoSerial(o.date),o.channel||'',o.customer,o.phone,...P.map(p=>{const q=o.items.filter(i=>i.pid===p.id).reduce((s,i)=>s+(+i.qty||0),0);return q||null}),c.units,c.listValue,c.itemDisc||null,o.disc!==''&&o.disc!=null?o.disc/100:null,o.flat!==''&&o.flat!=null?+o.flat:null,o.offer,o.override===''?null:+o.override,c.amount,o.payMode||((o.payments||[]).slice(-1)[0]||{}).mode||'',c.received||null,c.balance,c.pay,o.status,isoSerial(o.deliveryDate),c.daysOpen,c.next,o.notes])});
  const ws=XLSX.utils.aoa_to_sheet(aoa);const dcols=[1,head.indexOf('Delivery Date')],pc=head.indexOf('Discount %');
  for(let r=1;r<aoa.length;r++){dcols.forEach(ci=>{const a=XLSX.utils.encode_cell({r,c:ci});if(ws[a]&&ws[a].v!=null)ws[a].z='dd-mmm-yyyy'});const a=XLSX.utils.encode_cell({r,c:pc});if(ws[a])ws[a].z='0.##%'}
  ws['!cols']=head.map((h,i)=>({wch:i===2?32:i===head.length-1?50:/Next/.test(h)?26:14}));ws['!autofilter']={ref:XLSX.utils.encode_range({s:{r:0,c:0},e:{r:aoa.length-1,c:head.length-1}})};
  const pa=[['Order No','Customer','Payment Date','Mode','Amount (₹)','Ref']];list.forEach(o=>(o.payments||[]).forEach(p=>pa.push([o.no,o.customer,isoSerial(p.date),p.mode,+p.amount,p.ref||''])));
  const ws2=XLSX.utils.aoa_to_sheet(pa);for(let r=1;r<pa.length;r++){const a=XLSX.utils.encode_cell({r,c:2});if(ws2[a])ws2[a].z='dd-mmm-yyyy'}ws2['!cols']=[{wch:9},{wch:32},{wch:13},{wch:22},{wch:12},{wch:30}];
  const ws3=XLSX.utils.aoa_to_sheet([['Product','Rate (₹ per unit)','Note'],...P.map(p=>[p.name,p.rate,p.note||''])]);ws3['!cols']=[{wch:20},{wch:16},{wch:60}];
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,ws,'Orders');XLSX.utils.book_append_sheet(wb,ws2,'Payments');XLSX.utils.book_append_sheet(wb,ws3,'Rates');
  XLSX.writeFile(wb,'PEPAL_Orders_'+(scope==='filtered'?'filtered_':'')+stamp()+'.xlsx');toast(list.length+' orders exported');
}

document.addEventListener('input',e=>{
  const t=e.target;
  const keep=(sel,fn)=>{clearTimeout(qT);qT=setTimeout(()=>{fn();const pos=t.selectionStart;refresh();const n=$(sel);if(n){n.focus();try{n.setSelectionRange(pos,pos)}catch(er){}}},180)};
  if(t.dataset.wa){const pv=$('#wap_'+t.dataset.wa);if(pv)pv.textContent=waPreview(t.dataset.wa,t.value);return}
  if(t.id==='oq')keep('#oq',()=>{UI.of.q=t.value});
  if(t.id==='cq')keep('#cq',()=>{UI.custQ=t.value});
  if(t.id==='logq')keep('#logq',()=>{LOGF.q=t.value});
  if(t.id==='gsearch'){clearTimeout(qT);qT=setTimeout(()=>{UI.of.q=t.value;UI.of.drill=null;if(UI.tab!=='orders')setTab('orders');else refresh()},200)}
});
document.addEventListener('keydown',e=>{
  if(e.key==='Enter'&&(e.target.id==='l_pw'||e.target.id==='l_user'||e.target.id==='l_api')){e.preventDefault();doLogin();return}
});
$('#gsearch').addEventListener('keydown',e=>{if(e.key==='Enter'){const r=filteredOrders();if(r.length===1)pushDrawer(orderDrawer(r[0].o.id))}});
document.addEventListener('keydown',e=>{
  const typing=/INPUT|TEXTAREA|SELECT/.test(document.activeElement.tagName);
  if(e.key==='Escape'){if($('#modal').classList.contains('on'))closeModal();else if(drawerStack.length)closeDrawer();return}
  if(typing||e.ctrlKey||e.metaKey||e.altKey||!signedIn())return;
  if(e.key==='/'){e.preventDefault();$('#gsearch').focus()}
  else if(e.key==='n'||e.key==='N'){if(!$('#modal').classList.contains('on')){e.preventDefault();$('[data-act=new-order]').click()}}
});
$('#fileJson').addEventListener('change',e=>{const f=e.target.files[0];if(f)readJsonFile(f)});
$('#fileXlsx').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{importPreview(parseWorkbook(new Uint8Array(r.result)),f.name)}catch(err){console.error(err);toast('Import failed: '+err.message)}};r.readAsArrayBuffer(f)});
window.addEventListener('beforeunload',e=>{if(QUEUE.length&&SYNC.offline){e.preventDefault();e.returnValue=''}});
matchMedia('(prefers-color-scheme: dark)').addEventListener('change',renderHeader);

/* ============ init ============ */
(function(){const t=LS.get(THEMEKEY);if(t)document.documentElement.dataset.theme=t;
  if(!['dash','todo','orders','customers','log','settings'].includes(UI.tab))UI.tab='dash';
  buildView();refresh();if(signedIn())sync()})();
</script>
</body>
</html>
